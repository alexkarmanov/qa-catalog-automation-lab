{% extends "base.html" %}
{% block title %}Sign in - CAPS sandbox{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if signed_out %}<div class="flash" data-testid="login-notice">You have been signed out.</div>{% endif %}
{% if error %}<div class="error" role="alert" data-testid="login-error">{{ error }}</div>{% endif %}
<form method="post" action="/login" data-testid="login-form">
<p><label>Username <input id="username" name="username" autocomplete="off"></label></p>
<p><label>Password <input id="password" name="password" type="password" autocomplete="off"></label></p>
<p><button id="login-submit" type="submit">Sign in</button></p>
</form>
{% endblock %}
