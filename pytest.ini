[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers --strict-config -ra
timeout = 90
markers =
    change: framework example - a test that changes a fixture object (kept from 2023)
    check: framework example - a test that checks a fixture object (kept from 2023)
    http: basic HTTP contract checks against the local target
    api: REST tests against the local target (real HTTP on loopback)
    database: database adapter and SQL tests on fresh temporary SQLite files
    ui: any real-browser test (umbrella for selenium and playwright)
    selenium: real Chrome through Selenium 4 + Selenium Manager
    playwright: real Chromium through Playwright
    e2e: cross-layer browser -> API -> database flow
    framework: tests of the test infrastructure itself (isolation, teardown, failure handling)
    negative: rejection/negative-path test
    golden(id): links a test to a golden scenario of docs/TEST_PLAN.md, e.g. golden("G03")
